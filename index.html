<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff9a9e">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="image_0.png">
    
    <title>Generator Struk Hazuma Store V6</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            display: flex;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 1000px;
            max-width: 100%;
        }

        .form-panel {
            flex: 1;
            padding: 40px;
            border-right: 1px solid #eee;
        }

        .form-panel h2 {
            margin-top: 0;
            color: #333;
            background: linear-gradient(to right, #ff9a9e 0%, #fecfef 99%, #fad0c4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px;
            font-size: 16px; transition: border-color 0.3s; box-sizing: border-box;
        }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #ff9a9e; }
        .form-group input[readonly] { background-color: #f9f9f9; color: #888; cursor: not-allowed; }

        .button-group { display: flex; gap: 15px; margin-top: 30px; }
        .btn {
            padding: 12px 24px; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; text-align: center;
        }
        .btn-primary { background: linear-gradient(to right, #ff9a9e 0%, #a1c4fd 100%); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background-color: #eee; color: #333; }
        .btn-secondary:hover { background-color: #ddd; }
        .btn-success { background-color: #25D366; color: white; } /* Warna Hijau WA */
        .btn-success:hover { background-color: #20b858; }

        .struk-panel {
            flex: 1; padding: 40px; display: flex; flex-direction: column;
            align-items: center; background-color: #fafafa;
        }

        .struk-wrapper {
            background-color: #fff; width: 300px; padding: 20px; border: 1px solid #eee;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-family: 'Courier New', monospace;
            font-size: 14px; line-height: 1.4; color: #000; position: relative; z-index: 1;
        }

        .struk-wrapper::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('image_0.png'); background-size: 60px; 
            background-repeat: repeat; opacity: 0.1; z-index: -1; 
        }

        .struk-wrapper::after {
            content: ""; position: absolute; bottom: -10px; left: 0; width: 100%; height: 10px;
            background: linear-gradient(-45deg, transparent 5px, #fff 5px), linear-gradient(45deg, transparent 5px, #fff 5px);
            background-size: 10px 10px;
        }

        .struk-content-inner { position: relative; z-index: 2; }
        .struk-header { text-align: center; margin-bottom: 15px; }
        .struk-header h3 { margin: 0; font-size: 18px; text-transform: uppercase; }
        .struk-header p { margin: 2px 0; font-size: 12px; }
        .struk-divider { border-top: 1px dashed #000; margin: 10px 0; }
        .struk-divider-double { border-top: 2px dashed #000; margin: 10px 0; }
        .struk-row { display: flex; justify-content: space-between; margin: 4px 0; }
        .struk-label { color: #000; }
        .struk-value { text-align: right; max-width: 60%; word-wrap: break-word; }
        .struk-total { font-size: 16px; font-weight: bold; }
        .struk-footer { text-align: center; margin-top: 20px; font-size: 12px; }

        .hidden-fields { display: none; }
        
        /* Container untuk tombol aksi (Cetak & Bagikan) */
        .action-container {
            display: none; /* Disembunyikan sampai struk dibuat */
            flex-direction: column; gap: 10px; margin-top: 30px; width: 340px;
        }

        @media print {
            body { background-color: #fff; padding: 0; display: block; }
            .container { box-shadow: none; border: none; width: auto; display: block; }
            .form-panel, .action-container { display: none !important; }
            .struk-panel { padding: 0; background-color: #fff; display: flex; justify-content: center; }
            .struk-wrapper { border: none; box-shadow: none; width: 100%; padding: 10px; }
            .struk-wrapper::before { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-panel">
        <h2>Hazuma Store - Menu Struk</h2>
        <form id="transfer-form">
            <div class="form-group">
                <label for="jenis-layanan">Jenis Layanan</label>
                <select id="jenis-layanan" onchange="toggleLayanan(this.value)" required>
                    <option value="transfer_bank">Transfer Antar Bank</option>
                    <option value="transfer_cash">Transfer (Cash / Tunai)</option>
                    <option value="topup">Top-Up E-Wallet</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nama-penerima" id="label-penerima">Nama Penerima / Pelanggan</label>
                <input type="text" id="nama-penerima" placeholder="Contoh: Budi Santoso" required>
            </div>

            <div id="grup-bank-asal">
                <div class="form-group">
                    <label for="bank-pengirim">Dari Bank Kamu</label>
                    <select id="bank-pengirim">
                        <option value="BCA">BCA</option>
                        <option value="BNI">BNI</option>
                        <option value="Mandiri">Mandiri</option>
                        <option value="BRI">BRI</option>
                        <option value="Permata">Permata</option>
                    </select>
                </div>
            </div>

            <div id="grup-bank-tujuan">
                <div class="form-group">
                    <label for="bank-penerima">Ke Bank Tujuan</label>
                    <select id="bank-penerima">
                        <option value="BCA">BCA</option>
                        <option value="BNI">BNI</option>
                        <option value="Mandiri">Mandiri</option>
                        <option value="BRI">BRI</option>
                        <option value="Permata">Permata</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="norek-penerima">Nomor Rekening Tujuan</label>
                    <input type="text" id="norek-penerima" placeholder="Contoh: 1234567890">
                </div>
            </div>

            <div id="grup-topup" class="hidden-fields">
                <div class="form-group">
                    <label for="jenis-ewallet">Pilih E-Wallet</label>
                    <select id="jenis-ewallet">
                        <option value="DANA">DANA</option>
                        <option value="GOPAY">GOPAY</option>
                        <option value="OVO">OVO</option>
                        <option value="SHOPEEPAY">SHOPEEPAY</option>
                        <option value="LINKAJA">LINKAJA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="nohp-ewallet">Nomor HP / ID Akun</label>
                    <input type="text" id="nohp-ewallet" placeholder="Contoh: 081234567890">
                </div>
            </div>

            <div class="form-group">
                <label for="nominal">Nominal (Rp)</label>
                <input type="number" id="nominal" placeholder="Contoh: 50000" required>
            </div>
            <div class="form-group">
                <label for="biaya">Biaya Admin</label>
                <input type="number" id="biaya" value="2000" readonly>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-primary" onclick="generateStruk()">Buat Struk</button>
                <button type="reset" class="btn btn-secondary" onclick="resetStruk()">Reset</button>
            </div>
        </form>
    </div>

    <div class="struk-panel">
        <div class="struk-wrapper" id="struk-content">
            <div class="struk-content-inner">
                <div class="struk-header">
                    <h3>HAZUMA STORE</h3>
                    <p>Berjo, Ngargoyoso, Karanganyar</p>
                    <p>Jawa Tengah</p>
                </div>
                <div id="struk-details">
                    <p style="text-align:center; color:#888; font-family:sans-serif; font-size:12px;">Isi formulir di sebelah kiri dan klik 'Buat Struk' untuk melihat pratinjau.</p>
                </div>
            </div>
        </div>
        
        <div class="action-container" id="action-container">
            <button type="button" class="btn btn-success" onclick="bagikanStruk()" id="btn-bagikan">Bagikan Gambar (WA/IG)</button>
            <button type="button" class="btn btn-primary" onclick="cetakStruk()" style="background: #333;">Cetak / Simpan PDF</button>
        </div>
    </div>
</div>

<script>
    function toggleLayanan(layanan) {
        const grupBankAsal = document.getElementById('grup-bank-asal');
        const grupBankTujuan = document.getElementById('grup-bank-tujuan');
        const grupTopup = document.getElementById('grup-topup');
        const labelPenerima = document.getElementById('label-penerima');

        if (layanan === 'transfer_bank') {
            grupBankAsal.style.display = 'block';
            grupBankTujuan.style.display = 'block';
            grupTopup.style.display = 'none';
            labelPenerima.innerText = 'Nama Penerima / Pelanggan';
        } else if (layanan === 'transfer_cash') {
            grupBankAsal.style.display = 'none';
            grupBankTujuan.style.display = 'block';
            grupTopup.style.display = 'none';
            labelPenerima.innerText = 'Nama Penerima / Pelanggan';
        } else if (layanan === 'topup') {
            grupBankAsal.style.display = 'none';
            grupBankTujuan.style.display = 'none';
            grupTopup.style.display = 'block';
            labelPenerima.innerText = 'Nama Pemilik Akun E-Wallet';
        }
    }

    function formatRupiah(angka) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
    }

    function generateStruk() {
        const jenisLayanan = document.getElementById('jenis-layanan').value;
        const namaPenerima = document.getElementById('nama-penerima').value;
        const nominal = parseFloat(document.getElementById('nominal').value);
        const biaya = parseFloat(document.getElementById('biaya').value);

        if (!namaPenerima || isNaN(nominal)) {
            alert('Mohon isi Nama Pelanggan dan Nominal terlebih dahulu.');
            return;
        }

        const total = nominal + biaya;
        const tanggalWaktu = new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) + ' WIB';
        const noTransaksi = 'HS-' + Date.now().toString().slice(-8);

        let rincianLayananHtml = '';

        if (jenisLayanan === 'transfer_bank') {
            const bankPengirim = document.getElementById('bank-pengirim').value;
            const bankPenerima = document.getElementById('bank-penerima').value;
            const norekPenerima = document.getElementById('norek-penerima').value;

            rincianLayananHtml = `
                <div class="struk-row"><span class="struk-label">JENIS:</span><span class="struk-value">TRANSFER ANTAR BANK</span></div>
                <div class="struk-row"><span class="struk-label">DARI BANK:</span><span class="struk-value">${bankPengirim}</span></div>
                <div class="struk-divider"></div>
                <div class="struk-row"><span class="struk-label">KE BANK:</span><span class="struk-value">${bankPenerima}</span></div>
                <div class="struk-row"><span class="struk-label">NO REK:</span><span class="struk-value">${norekPenerima || '-'}</span></div>
                <div class="struk-row"><span class="struk-label">PENERIMA:</span><span class="struk-value">${namaPenerima}</span></div>
            `;
        } else if (jenisLayanan === 'transfer_cash') {
            const bankPenerima = document.getElementById('bank-penerima').value;
            const norekPenerima = document.getElementById('norek-penerima').value;

            rincianLayananHtml = `
                <div class="struk-row"><span class="struk-label">JENIS:</span><span class="struk-value">TRANSFER (CASH)</span></div>
                <div class="struk-row"><span class="struk-label">KE BANK:</span><span class="struk-value">${bankPenerima}</span></div>
                <div class="struk-row"><span class="struk-label">NO REK:</span><span class="struk-value">${norekPenerima || '-'}</span></div>
                <div class="struk-row"><span class="struk-label">PENERIMA:</span><span class="struk-value">${namaPenerima}</span></div>
            `;
        } else if (jenisLayanan === 'topup') {
            const jenisEwallet = document.getElementById('jenis-ewallet').value;
            const nohpEwallet = document.getElementById('nohp-ewallet').value;

            rincianLayananHtml = `
                <div class="struk-row"><span class="struk-label">JENIS:</span><span class="struk-value">TOP-UP E-WALLET</span></div>
                <div class="struk-row"><span class="struk-label">E-WALLET:</span><span class="struk-value">${jenisEwallet}</span></div>
                <div class="struk-row"><span class="struk-label">NO. HP/ID:</span><span class="struk-value">${nohpEwallet || '-'}</span></div>
                <div class="struk-row"><span class="struk-label">PEMILIK:</span><span class="struk-value">${namaPenerima}</span></div>
            `;
        }

        const detailsHtml = `
            <div class="struk-divider"></div>
            <div class="struk-row"><span class="struk-label">TANGGAL:</span><span class="struk-value">${tanggalWaktu}</span></div>
            <div class="struk-row"><span class="struk-label">NO TRANS:</span><span class="struk-value">${noTransaksi}</span></div>
            <div class="struk-divider-double"></div>
            
            ${rincianLayananHtml}
            
            <div class="struk-divider-double"></div>
            <div class="struk-row"><span class="struk-label">NOMINAL:</span><span class="struk-value">${formatRupiah(nominal)}</span></div>
            <div class="struk-row"><span class="struk-label">ADMIN:</span><span class="struk-value">${formatRupiah(biaya)}</span></div>
            <div class="struk-divider"></div>
            <div class="struk-row struk-total"><span class="struk-label">TOTAL:</span><span class="struk-value">${formatRupiah(total)}</span></div>
            <div class="struk-row"><span class="struk-label">STATUS:</span><span class="struk-value">BERHASIL</span></div>
            <div class="struk-divider-double"></div>
            
            <div class="struk-footer">
                <p>Terima Kasih Telah Menggunakan</p>
                <p>Layanan Hazuma Store</p>
                <p>Simpan Struk Ini Sebagai Bukti Sah</p>
            </div>
        `;

        document.getElementById('struk-details').innerHTML = detailsHtml;
        
        // Tampilkan tombol aksi (Cetak & Bagikan)
        document.getElementById('action-container').style.display = 'flex';

        document.title = 'Struk_' + noTransaksi + '_' + namaPenerima.replace(/\s+/g, '_');
    }

    function resetStruk() {
        document.getElementById('struk-details').innerHTML = `<p style="text-align:center; color:#888; font-family:sans-serif; font-size:12px;">Isi formulir di sebelah kiri dan klik 'Buat Struk' untuk melihat pratinjau.</p>`;
        document.getElementById('action-container').style.display = 'none';
        document.getElementById('jenis-layanan').value = 'transfer_bank';
        toggleLayanan('transfer_bank');
        document.title = 'Generator Struk Hazuma Store V6';
    }

    function cetakStruk() {
        window.print();
    }

    // --- FUNGSI BARU: MENGUBAH HTML JADI GAMBAR & MEMBAGIKANNYA ---
    async function bagikanStruk() {
        const btnBagikan = document.getElementById('btn-bagikan');
        btnBagikan.innerText = 'Memproses Gambar...';
        btnBagikan.disabled = true;

        const strukElement = document.getElementById('struk-content');
        
        try {
            // Mengambil screenshot elemen HTML
            const canvas = await html2canvas(strukElement, {
                scale: 2, // Biar gambarnya HD
                backgroundColor: "#ffffff",
                useCORS: true // Penting agar watermark tidak hilang
            });

            // Merubah Canvas menjadi file gambar (Blob)
            canvas.toBlob(async function(blob) {
                // Ambil no transaksi dari title yang sudah di-set saat klik Buat Struk
                const noTransaksi = document.title.split('_')[1] || 'Baru';
                const fileName = 'Struk_Hazuma_' + noTransaksi + '.png';
                const file = new File([blob], fileName, { type: 'image/png' });

                // Cek apakah HP/Browser support fitur "Share" native
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'Struk Transaksi Hazuma Store',
                            text: 'Berikut adalah bukti transaksi Anda dari Hazuma Store. Terima kasih!'
                        });
                        console.log('Berhasil membagikan struk');
                    } catch (err) {
                        console.log('Batal membagikan', err);
                    }
                } else {
                    // Kalau buka di laptop / browser yang tidak dukung Web Share, otomatis download gambarnya
                    alert('Browser Anda tidak mendukung menu share langsung. Gambar akan diunduh otomatis.');
                    const link = document.createElement('a');
                    link.download = fileName;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }

                // Kembalikan tombol ke semula
                btnBagikan.innerText = 'Bagikan Gambar (WA/IG)';
                btnBagikan.disabled = false;
            }, 'image/png');

        } catch (error) {
            console.error("Gagal membuat gambar struk:", error);
            alert("Terjadi kesalahan saat memproses gambar.");
            btnBagikan.innerText = 'Bagikan Gambar (WA/IG)';
            btnBagikan.disabled = false;
        }
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch((err) => console.log('SW error', err));
        });
    }
</script>
</body>
</html>
